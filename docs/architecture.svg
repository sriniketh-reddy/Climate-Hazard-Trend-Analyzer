<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="820" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350 M 0,400 L 1200,400 M 0,450 L 1200,450 M 0,500 L 1200,500 M 0,550 L 1200,550 M 0,600 L 1200,600 M 0,650 L 1200,650 M 0,700 L 1200,700 M 0,750 L 1200,750" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 50,0 L 50,820 M 100,0 L 100,820 M 150,0 L 150,820 M 200,0 L 200,820 M 250,0 L 250,820 M 300,0 L 300,820 M 350,0 L 350,820 M 400,0 L 400,820 M 450,0 L 450,820 M 500,0 L 500,820 M 550,0 L 550,820 M 600,0 L 600,820 M 650,0 L 650,820 M 700,0 L 700,820 M 750,0 L 750,820 M 800,0 L 800,820 M 850,0 L 850,820 M 900,0 L 900,820 M 950,0 L 950,820 M 1000,0 L 1000,820 M 1050,0 L 1050,820 M 1100,0 L 1100,820 M 1150,0 L 1150,820" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(60, 42)">
    <circle cx="16" cy="16" r="16" fill="#0284c7" opacity="0.2"/>
    <circle cx="16" cy="16" r="8" fill="#38bdf8"/>
    <text x="46" y="22" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">CLIMATE HAZARD TREND ANALYZER</text>
    <rect x="420" y="5" width="190" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="432" y="21" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="0.5">END-TO-END ARCHITECTURE</text>
    <text x="46" y="44" fill="#94a3b8" font-size="13">High-Performance Geospatial Caching, WMO Baseline Logic &amp; Empirical Trend Analytics</text>
  </g>

  <!-- ================= TIER 1: CLIENT PRESENTATION (TOP) ================= -->
  <g transform="translate(60, 105)" filter="url(#cardShadow)">
    <rect width="1080" height="150" rx="14" fill="url(#clientGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Tier Header Tag -->
    <rect x="20" y="-12" width="220" height="24" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="32" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">PRESENTATION TIER (CLIENT)</text>

    <!-- Sub-components within Client -->
    <!-- 1. Leaflet Map -->
    <g transform="translate(24, 28)">
      <rect width="240" height="100" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#0284c7" opacity="0.2"/>
      <text x="21" y="33" fill="#38bdf8" font-size="16">📍</text>
      <text x="52" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Leaflet Map Selector</text>
      <text x="52" y="46" fill="#94a3b8" font-size="11">Custom Pin Tray</text>
      <text x="14" y="78" fill="#64748b" font-size="10.5">India bounding box constraint</text>
      <text x="14" y="94" fill="#38bdf8" font-size="10" font-weight="600">Lat: 6°-38°N | Lon: 68°-98°E</text>
    </g>

    <!-- 2. Apple Controls -->
    <g transform="translate(288, 28)">
      <rect width="245" height="100" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#8b5cf6" opacity="0.2"/>
      <text x="21" y="33" fill="#a78bfa" font-size="16">🎛️</text>
      <text x="52" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Apple Glass Controls</text>
      <text x="52" y="46" fill="#94a3b8" font-size="11">Segmented Sliding Pill</text>
      <text x="14" y="78" fill="#64748b" font-size="10.5">Preset &amp; Custom Dates (1940+)</text>
      <text x="14" y="94" fill="#a78bfa" font-size="10" font-weight="600">Circling Beam Liquid CTA</text>
    </g>

    <!-- 3. Recharts Visualization -->
    <g transform="translate(557, 28)">
      <rect width="245" height="100" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
      <text x="21" y="33" fill="#fbbf24" font-size="16">📈</text>
      <text x="52" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Interactive Analytics</text>
      <text x="52" y="46" fill="#94a3b8" font-size="11">Recharts Visual Suite</text>
      <text x="14" y="78" fill="#64748b" font-size="10.5">Decadal trendline regression</text>
      <text x="14" y="94" fill="#fbbf24" font-size="10" font-weight="600">Monthly deficit anomaly bars</text>
    </g>

    <!-- 4. Export & Telemetry -->
    <g transform="translate(826, 28)">
      <rect width="230" height="100" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#10b981" opacity="0.2"/>
      <text x="21" y="33" fill="#34d399" font-size="16">📥</text>
      <text x="52" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Export &amp; Transparency</text>
      <text x="52" y="46" fill="#94a3b8" font-size="11">CSV Data Engine</text>
      <text x="14" y="78" fill="#64748b" font-size="10.5">Raw daily rows + metrics</text>
      <text x="14" y="94" fill="#34d399" font-size="10" font-weight="600">WMO Baseline 1991-2020</text>
    </g>
  </g>

  <!-- ================= CONNECTOR: CLIENT TO BACKEND ================= -->
  <g>
    <!-- Downward Line -->
    <path d="M 600,255 L 600,320" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowCyan)"/>
    <rect x="475" y="272" width="250" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="600" y="289" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">
      POST /api/analysis <tspan fill="#38bdf8">{lat, lon, start, end, hazard}</tspan>
    </text>
  </g>

  <!-- ================= TIER 2: APPLICATION & SCIENCE TIER (MIDDLE) ================= -->
  <g transform="translate(60, 325)" filter="url(#cardShadow)">
    <rect width="1080" height="270" rx="14" fill="url(#backendGrad)" stroke="#4338ca" stroke-width="1.2"/>
    
    <!-- Tier Header Tag -->
    <rect x="20" y="-12" width="260" height="24" rx="6" fill="#4338ca" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">APPLICATION &amp; SCIENCE TIER (FASTAPI)</text>

    <!-- Sub-module 1: Gateway & Validation -->
    <g transform="translate(24, 25)">
      <rect width="240" height="110" rx="10" fill="#0d1124" stroke="#1e1b4b" stroke-width="1"/>
      <text x="16" y="28" fill="#a5b4fc" font-size="12" font-weight="700">1. INPUT GUARD &amp; GEOLIMITS</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="11">Pydantic v2 Schema Validation</text>
      <text x="16" y="66" fill="#94a3b8" font-size="10.5">• Lat [6°-38°N], Lon [68°-98°E]</text>
      <text x="16" y="82" fill="#94a3b8" font-size="10.5">• Date format: YYYY-MM-DD</text>
      <text x="16" y="98" fill="#ef4444" font-size="10" font-weight="600">Strict HTTP 422 Rejection</text>
    </g>

    <!-- Sub-module 2: Spatial Snapping -->
    <g transform="translate(288, 25)">
      <rect width="245" height="110" rx="10" fill="#0d1124" stroke="#1e1b4b" stroke-width="1"/>
      <text x="16" y="28" fill="#38bdf8" font-size="12" font-weight="700">2. SPATIAL ERA5 SNAPPING</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="11">0.25° Grid Centering Engine</text>
      <text x="16" y="66" fill="#94a3b8" font-size="10.5">• Round to nearest 0.25° (28km)</text>
      <text x="16" y="82" fill="#94a3b8" font-size="10.5">• E.g. (17.38, 78.48) → (17.25, 78.50)</text>
      <text x="16" y="98" fill="#38bdf8" font-size="10" font-weight="600">Collapses Nearby User Clicks</text>
    </g>

    <!-- Sub-module 3: Smart Caching Engine -->
    <g transform="translate(557, 25)">
      <rect width="500" height="110" rx="10" fill="#0d1124" stroke="#1e1b4b" stroke-width="1"/>
      <text x="16" y="28" fill="#34d399" font-size="12" font-weight="700">3. INCREMENTAL CACHE CONTROLLER (MONGODB)</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="11">Single-Collection Document Model Keyed by "lon,lat"</text>
      <text x="16" y="68" fill="#94a3b8" font-size="10.5"><tspan fill="#34d399" font-weight="600">Cache Hit:</tspan> Slices cached date arrays in &lt;15ms without external API call</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10.5"><tspan fill="#fbbf24" font-weight="600">Delta Miss:</tspan> Identifies missing date gaps (prefix/suffix) &amp; fetches deltas only</text>
      <text x="16" y="102" fill="#a78bfa" font-size="10" font-weight="600">Zero Redundant Latency | Atomic Bulk Upsert</text>
    </g>

    <!-- Divider Bar inside Backend -->
    <path d="M 24,150 L 1056,150" stroke="#312e81" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Sub-module 4: Heatwave Engine -->
    <g transform="translate(24, 162)">
      <rect width="330" height="92" rx="10" fill="#18122c" stroke="#3730a3" stroke-width="1"/>
      <text x="16" y="24" fill="#fb923c" font-size="12" font-weight="700">HEATWAVE ENGINE (WMO STD)</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="10.5">Reference Period: 1991–2020 Normal</text>
      <text x="16" y="58" fill="#94a3b8" font-size="10.5">Threshold: 95th Percentile Baseline</text>
      <text x="16" y="74" fill="#94a3b8" font-size="10.5">Condition: Consecutive Days ≥ 3 Runs</text>
      <text x="16" y="88" fill="#fb923c" font-size="9.5" font-weight="600">Calendar-year boundary attribution</text>
    </g>

    <!-- Sub-module 5: Drought Engine -->
    <g transform="translate(378, 162)">
      <rect width="330" height="92" rx="10" fill="#18122c" stroke="#3730a3" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700">METEOROLOGICAL DROUGHT</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="10.5">Monthly Precipitation Aggregation</text>
      <text x="16" y="58" fill="#94a3b8" font-size="10.5">Threshold: Calendar-Month 20th Pct</text>
      <text x="16" y="74" fill="#94a3b8" font-size="10.5">Deficit: max(0, Historical Median - Total)</text>
      <text x="16" y="88" fill="#38bdf8" font-size="9.5" font-weight="600">Reliability guard: &lt;20% missing values</text>
    </g>

    <!-- Sub-module 6: Statistical Trend Engine -->
    <g transform="translate(732, 162)">
      <rect width="324" height="92" rx="10" fill="#18122c" stroke="#3730a3" stroke-width="1"/>
      <text x="16" y="24" fill="#c084fc" font-size="12" font-weight="700">OLS TREND &amp; SIGNIFICANCE</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="10.5">Ordinary Least Squares Regression</text>
      <text x="16" y="58" fill="#94a3b8" font-size="10.5">Slope per decade | R² Goodness-of-fit</text>
      <text x="16" y="74" fill="#94a3b8" font-size="10.5">Two-tailed t-test (p &lt; 0.05) &amp; 95% CI</text>
      <text x="16" y="88" fill="#c084fc" font-size="9.5" font-weight="600">Requires ≥ 10 years continuous data</text>
    </g>
  </g>

  <!-- ================= TIER 3: BOTTOM TIERS (STORAGE & EXTERNAL) ================= -->
  
  <!-- Left Bottom: MongoDB Storage -->
  <g transform="translate(60, 640)" filter="url(#cardShadow)">
    <rect width="490" height="140" rx="14" fill="url(#dbGrad)" stroke="#059669" stroke-width="1.2"/>
    <rect x="20" y="-12" width="220" height="24" rx="6" fill="#047857" stroke="#34d399" stroke-width="1"/>
    <text x="32" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">DATABASE TIER (MONGODB)</text>

    <g transform="translate(24, 26)">
      <rect width="442" height="92" rx="8" fill="#022c22" stroke="#065f46" stroke-width="1"/>
      <text x="16" y="24" fill="#a7f3d0" font-size="13" font-weight="700">Collections: max_temperature | precipitation</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">Index: <tspan fill="#34d399" font-weight="600">{ location_key: 1 }</tspan> where key = "lon,lat"</text>
      <text x="16" y="62" fill="#94a3b8" font-size="10.5">Document Structure: { location_key, records: [ { date, value } ] }</text>
      <text x="16" y="80" fill="#34d399" font-size="10.5" font-weight="600">Atomic $addToSet / $set upsert avoids duplicate writes</text>
    </g>
  </g>

  <!-- Right Bottom: External ERA5 Provider -->
  <g transform="translate(590, 640)" filter="url(#cardShadow)">
    <rect width="550" height="140" rx="14" fill="url(#extGrad)" stroke="#9333ea" stroke-width="1.2"/>
    <rect x="20" y="-12" width="260" height="24" rx="6" fill="#7e22ce" stroke="#c084fc" stroke-width="1"/>
    <text x="32" y="4" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">DATA SOURCE (OPEN-METEO ERA5)</text>

    <g transform="translate(24, 26)">
      <rect width="502" height="92" rx="8" fill="#24073d" stroke="#581c87" stroke-width="1"/>
      <text x="16" y="24" fill="#f5d0fe" font-size="13" font-weight="700">ECMWF ERA5 Reanalysis Archive API</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">Resolution: 0.25° × 0.25° (~28 km) | Daily 1940 to Present</text>
      <text x="16" y="62" fill="#94a3b8" font-size="10.5">QC Protocol: Flags -20°C &gt; T &gt; 55°C, Precip &lt; 0 or &gt; 600mm/day</text>
      <text x="16" y="80" fill="#c084fc" font-size="10.5" font-weight="600">Archival Latency Recovery: Auto-clamps 5-day lag to latest valid date</text>
    </g>
  </g>

  <!-- ================= CONNECTORS: BACKEND TO DB & EXTERNAL ================= -->
  <!-- Backend to DB Connector -->
  <path d="M 305,595 L 305,640" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="230" y="605" width="150" height="20" rx="10" fill="#022c22" stroke="#059669" stroke-width="1"/>
  <text x="305" y="619" fill="#a7f3d0" font-size="9.5" font-weight="600" text-anchor="middle">Lookup / Atomic Upsert</text>

  <!-- Backend to External Connector -->
  <path d="M 865,595 L 865,640" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="785" y="605" width="160" height="20" rx="10" fill="#2e1065" stroke="#9333ea" stroke-width="1"/>
  <text x="865" y="619" fill="#f5d0fe" font-size="9.5" font-weight="600" text-anchor="middle">Async Delta Fetch (Miss)</text>

</svg>
